name: Build Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-2022

    permissions:
      contents: read

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: clear

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies (Web UI)
        shell: bash
        run: |
          npm install

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Chocolatey dependencies
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          choco install pkgconfiglite --yes --no-progress

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: a42af01b72c28a8e1d7b48107b33e4f286a55ef6

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          vcpkg install `
            curl:x64-windows `
            miniupnpc:x64-windows `
            minhook:x64-windows

      - name: Set PKG_CONFIG_PATH
        shell: pwsh
        run: |
          $pkgconfig="${{ github.workspace }}\third-party\build-deps\dist\Windows-AMD64\lib\pkgconfig"
          "PKG_CONFIG_PATH=$pkgconfig" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build ^
            -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DBUILD_DOCS=OFF ^
            -DBUILD_TESTS=OFF ^
            -DSUNSHINE_ENABLE_TRAY=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%

      - name: Package (NSIS installer)
        shell: cmd
        run: |
          cd build
          cpack -G NSIS

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Windows-Installer
          path: build/*.exe
          retention-days: 30
