name: Build Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    permissions:
      contents: read

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: clear

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools (NSIS, Ninja, pkgconfig)
        shell: pwsh
        run: |
          choco install nsis ninja pkgconfiglite --yes --no-progress

      - name: Remove MinGW from PATH (IMPORTANT)
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch "mingw" }) -join ';'
          echo "MinGW removed from PATH"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          .\vcpkg\vcpkg.exe install `
            curl:x64-windows `
            miniupnpc:x64-windows `
            minhook:x64-windows `
            boost-system:x64-windows `
            boost-filesystem:x64-windows `
            boost-thread:x64-windows `
            boost-asio:x64-windows

      - name: Configure CMake (MSVC + Ninja)
        shell: cmd
        run: |
          cmake -B build ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DBUILD_DOCS=OFF ^
            -DBUILD_TESTS=OFF ^
            -DSUNSHINE_ENABLE_TRAY=ON

      - name: Build
        shell: cmd
        run: cmake --build build --parallel

      - name: Package (NSIS installer)
        shell: cmd
        run: |
          cd build
          cpack -G NSIS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: build/*.exe
          retention-days: 30
