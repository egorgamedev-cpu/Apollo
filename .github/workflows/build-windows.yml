name: Build Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install npm dependencies (Web UI)
        shell: bash
        run: |
          npm install

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies via Chocolatey
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          choco install strawberryperl --yes --no-progress
          choco install pkgconfiglite --yes --no-progress

      - name: Install pkg-config via winget fallback
        shell: pwsh
        run: |
          # Add Strawberry Perl pkg-config to PATH (pkgconfiglite alternative)
          $pkgconfig = "C:\Strawberry\c\bin"
          if (Test-Path $pkgconfig) {
            echo "$pkgconfig" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Setup pkg-config for Windows
        shell: pwsh
        run: |
          # Install pkg-config via pip as fallback
          pip install setuptools
          # Download pkg-config binary
          $url = "https://github.com/jtojnar/pkg-config-wrapper/releases/latest/download/pkg-config-windows-amd64.exe"
          $dest = "C:\Windows\System32\pkg-config.exe"
          try {
            Invoke-WebRequest -Uri $url -OutFile $dest -ErrorAction Stop
            Write-Host "pkg-config downloaded successfully"
          } catch {
            Write-Host "Trying alternative pkg-config source..."
            choco install pkgconfiglite --yes --force --no-progress
          }

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build ^
            -G "NMake Makefiles" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_DOCS=OFF ^
            -DBUILD_TESTS=OFF ^
            -DSUNSHINE_ENABLE_TRAY=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Package (NSIS installer)
        shell: cmd
        run: |
          cd build
          cpack -G NSIS

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apollo-Windows-Installer
          path: build/*.exe
          retention-days: 30
